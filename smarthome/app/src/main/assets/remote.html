<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Home">
<meta name="theme-color" content="#000000">
<title>Smart Home</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* Smart Home on a phone, the same look as the TV app: the muted scene behind frosted glass, Outfit type,
     round icon buttons, white when focused or pressed. Keep the two in step (smarthome/app/src/main/res). */
  @font-face { font-family: Outfit; src: url(/outfit.ttf) format("truetype"); font-weight: 100 900; font-display: swap; }
  :root { --bg: #000; --tile: rgb(255 255 255 / .13); --tile2: rgb(255 255 255 / .22); --text: #fff; --dim: rgb(255 255 255 / .55); --line: rgb(255 255 255 / .16);
          --on: #f2f2f7; --on-text: #000; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text); font: 16px Outfit, -apple-system, system-ui, sans-serif; }
  /* the TV's wallpaper (--scene, set by backdrop()), dimmed by a plain overlay: a filter on a full-screen fixed layer can stall scrolling */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
                 background: linear-gradient(rgb(0 0 0 / .5), rgb(0 0 0 / .5)), var(--scene, none) center / cover; }
  .tile, .pill, .filters button, .menu button, .chips button, .seg, .type input, .type button, .form input[type=text], .form input[type=time],
  .form select, .actions button, .toast, .sw { -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
  .tile, .pill, .filters button, .menu button, .chips button, .type input, .actions button { border: 1px solid rgb(255 255 255 / .14); }
  body { padding: calc(env(safe-area-inset-top) + 16px) 16px max(28px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto;
         -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 2px; }
  h1 { font-size: 36px; font-weight: 300; margin: 0; }
  #summary { color: var(--dim); font-size: 14px; margin: 0 0 14px; min-height: 18px; }
  .pills { display: flex; gap: 8px; }
  .pill { height: 42px; padding: 0 14px; border-radius: 21px; background: var(--tile); display: inline-flex; align-items: center; gap: 6px;
          font-size: 14px; font-weight: 500; }
  .pill.icon { width: 42px; padding: 0; justify-content: center; }
  .pill:active { background: var(--tile2); }

  .filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 6px; padding: 0 0 4px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--tile); font-size: 14px; white-space: nowrap; flex: none; }
  .filters button.on { background: rgb(255 255 255 / .28); color: #fff; }

  h2 { display: flex; justify-content: space-between; align-items: center; }
  .smv { display: none; gap: 8px; }
  .smv span { width: 34px; height: 30px; border-radius: 10px; background: #3a3a3c; color: #fff; display: grid; place-items: center;
              font-size: 12px; letter-spacing: 0; cursor: pointer; }
  body.editing .smv { display: flex; }
  h2 { font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; margin: 22px 2px 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: linear-gradient(rgb(255 255 255 / .17), rgb(255 255 255 / .08)); border-radius: 22px; padding: 14px; min-height: 104px; display: flex; flex-direction: column;
          justify-content: space-between; text-align: left; position: relative; }
  .tile:active { transform: scale(.98); }
  .tile .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tile .badge { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--dim); }
  .tile .name { font-weight: 500; font-size: 16px; margin-top: 10px; }
  .tile .sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .tile.on .top svg { color: var(--green); }
  .tile.on .badge { color: var(--text); }
  .tile.flash { background: var(--on); color: var(--on-text); } .tile.flash .sub { color: #3a3a3c; }
  .tile.offline { opacity: .45; }
  .tile.auto.off { opacity: .55; }
  .empty { color: var(--dim); font-size: 14px; }

  /* the wallpaper gallery */
  .walls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .wall { position: relative; padding: 0; border-radius: 16px; overflow: hidden; background: var(--tile); border: 1px solid rgb(255 255 255 / .14); text-align: left; color: var(--text); }
  .wall img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; transition: opacity .2s, filter .2s; }
  .wall.off img { opacity: .35; filter: grayscale(1); }
  .wall .cap { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px 9px; font-size: 14px; font-weight: 500; }
  .wall .cap small { font-size: 11px; color: var(--green); font-weight: 600; letter-spacing: .04em; }
  .wall .tick { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
                background: var(--green); color: #000; font-size: 15px; font-weight: 700; }
  .wall.off .tick { background: rgb(0 0 0 / .45); border: 1.5px solid rgb(255 255 255 / .6); color: transparent; }

  /* sheets: the TV remote and Activity slide up over the page */
  .sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .5); display: none; z-index: 10; }
  .sheet.open { display: block; }
  /* Every pop-up is as tall as its content (never more), with a Back button on top; a long one scrolls under a cap,
     and Activity stays at half the screen. The strip above it dims the page and closes it when tapped. */
  .panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; height: auto; max-height: 92vh; max-height: 92dvh;
           background: #1c1c22; border-radius: 22px 22px 0 0; border-top: 1px solid rgb(255 255 255 / .14);
           -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%);
           padding: 0 16px max(22px, env(safe-area-inset-bottom)); overflow: auto; }
  #logSheet .panel { max-height: 50vh; max-height: 50dvh; }
  .sheet.open .panel { animation: page-in .22s cubic-bezier(.22, 1, .36, 1); }
  @keyframes page-in { from { transform: translateY(24px); opacity: 0; } }
  .panel > .grab, .panel .grab { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; width: auto; height: 54px;
           padding: 0 4px; margin: 0 -16px 6px; background: #1c1c22; border-radius: 22px 22px 0 0; cursor: pointer; touch-action: manipulation; }
  .grab::before { content: "\2039"; font-size: 34px; line-height: 1; font-weight: 300; margin: -4px 8px 0 12px; }
  .grab::after { content: "Back"; font-size: 17px; font-weight: 500; }
           border-radius: 22px 22px 0 0; padding: 10px 16px max(22px, env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }

  #motionBanner { all: unset; display: none; position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%);
    z-index: 20; padding: 9px 16px; border-radius: 999px; background: #1d1d20; color: #fff; font-size: 14px; white-space: nowrap;
    box-shadow: 0 4px 18px rgb(0 0 0 / .5); cursor: pointer; }
  #motionBanner i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: #ff9f0a; }
  #motionPlayer { width: 100%; border-radius: 12px; background: #000; margin-bottom: 12px; display: none; }
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .clips > div { position: relative; font-size: 13px; color: var(--dim); }
  .clips .play { all: unset; cursor: pointer; display: block; }
  .clips .del, .clips .save { all: unset; cursor: pointer; position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; line-height: 28px;
    text-align: center; border-radius: 50%; background: rgb(0 0 0 / .65); color: #fff; font-size: 16px; }
  .clips .save { right: 38px; font-size: 15px; }
  .clips img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: #222; margin-bottom: 4px; }
  .seg.mode { display: flex; margin-bottom: 10px; } .seg.mode button { flex: 1; }
  #scr { display: none; position: relative; }
  #scrImg { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; background: #000; touch-action: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #scrTap { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: rgba(255,255,255,.55); opacity: 0; transition: opacity .4s; pointer-events: none; }
  #scrStatus { position: absolute; left: 10px; top: 8px; font-size: 12px; color: #8e8e93; pointer-events: none; }
  .remote-screen #pad { display: none; } .remote-screen #scr { display: block; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-head b { font-size: 18px; }
  .panel-head .status { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .dot.ok { background: var(--green); } .dot.warn { background: var(--orange); } .dot.bad { background: var(--red); }

  #pad { aspect-ratio: 1.15; width: 100%; border-radius: 26px; background: var(--tile); position: relative; touch-action: none; overflow: hidden; }
  #pad .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #48484a; font-size: 13px; pointer-events: none; }
  /* The remote, in glass (the look of couch-tv's phone remote, github.com/Seagey/couch-tv): a swipe pad with chevrons and a ring, round controls, a volume pill */

  .glass { background: rgb(255 255 255 / .13); border: 1px solid rgb(255 255 255 / .17); box-shadow: inset 0 1px 0 rgb(255 255 255 / .1);
    -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
  .glass:active, .ckey.down { background: rgb(255 255 255 / .24); }
  #remoteSheet .seg.mode { background: rgb(255 255 255 / .1); border: 1px solid rgb(255 255 255 / .14); }
  #remoteSheet .seg.mode button.on { background: rgb(255 255 255 / .26); box-shadow: inset 0 1px 0 rgb(255 255 255 / .2); }
  #remoteSheet .panel-head { gap: 8px; } #remoteSheet .panel-head b { flex: 1; }
  .round { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; padding: 0; color: #fff; }
  .round.big { width: 56px; height: 56px; }
  .round svg, .volume svg { width: 24px; height: 24px; fill: currentColor; stroke: none; pointer-events: none; }
  #pad { aspect-ratio: 1.1; border-radius: 34px; background: rgb(255 255 255 / .13); border: 1px solid rgb(255 255 255 / .17);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .1); display: grid; place-items: center; }
  #pad .chev { position: absolute; width: 24px; height: 24px; opacity: .38; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    transition: opacity .35s, transform .35s cubic-bezier(.22, 1, .36, 1); pointer-events: none; }
  #pad .chev.up { top: 16px; } #pad .chev.down { bottom: 16px; transform: rotate(180deg); }
  #pad .chev.left { left: 16px; transform: rotate(-90deg); } #pad .chev.right { right: 16px; transform: rotate(90deg); }
  #pad .chev.lit { opacity: 1; transition: none; }
  #pad .chev.up.lit { transform: translateY(-3px); } #pad .chev.down.lit { transform: rotate(180deg) translateY(-3px); }
  #pad .chev.left.lit { transform: rotate(-90deg) translateY(-3px); } #pad .chev.right.lit { transform: rotate(90deg) translateY(-3px); }
  #pad .ring { width: 92px; height: 92px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .24); transition: background .35s, transform .35s cubic-bezier(.22, 1, .36, 1); pointer-events: none; }
  #pad .ring.lit { background: rgb(255 255 255 / .16); transform: scale(.94); transition: none; }
  #pad .hint { inset: auto; top: calc(50% + 62px); left: 0; right: 0; display: block; text-align: center; color: rgb(255 255 255 / .5); }
  #pad .spot { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(closest-side, rgb(255 255 255 / .22), rgb(255 255 255 / 0)); transition: opacity .25s; }
  .controls { display: flex; justify-content: space-between; margin-top: 14px; }
  .volume { display: flex; align-items: stretch; height: 56px; border-radius: 28px; overflow: hidden; margin-top: 12px; }
  .volume button { flex: 1; display: grid; place-items: center; color: #fff; }
  .volume .vol-mid { flex: 1.3; color: rgb(255 255 255 / .74); }
  .key:active, .key.down { background: var(--tile2); }
  .key.power { color: var(--red); }
  .type { display: flex; gap: 8px; margin-top: 12px; }
  .type input { flex: 1; min-width: 0; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--tile); color: var(--text);
                padding: 0 14px; font: inherit; font-size: 16px; outline: none; -webkit-user-select: text; user-select: text; }
  .type input:focus { border-color: #636366; }
  .type button { height: 46px; padding: 0 16px; border-radius: 14px; background: var(--tile2); font-weight: 600; }
  .log { font-size: 14px; line-height: 1.55; color: #c7c7cc; white-space: pre-wrap; }
  .log div { padding: 8px 0; border-bottom: 1px solid #1f1f21; } .log time { color: var(--dim); font-size: 12px; display: block; }

  /* the energy dashboard: the same cards, chart and lists as the TV */
  #ePrice { height: 34px; font-size: 13px; padding: 0 12px; }
  .egrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .ecard { background: linear-gradient(rgb(255 255 255 / .17), rgb(255 255 255 / .08)); border: 1px solid rgb(255 255 255 / .14); border-radius: 18px; padding: 12px 14px; min-width: 0; }
  .ecard small { display: block; font-size: 11px; font-weight: 500; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
  .ecard .big { font-size: 28px; font-weight: 300; margin: 2px 0; white-space: nowrap; }
  .ecard .big.mid { font-size: 19px; font-weight: 400; margin: 6px 0 2px; }
  .ecard p { margin: 0; font-size: 13px; color: rgb(255 255 255 / .8); }
  .ecard p.dim { color: var(--dim); font-size: 12px; }
  .ecard .up { color: #ffb454; } .ecard .down { color: var(--green); }
  .echart { margin-top: 12px; } .echart .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .echart .head b { font-size: 14px; font-weight: 500; } .echart .head span { font-size: 12px; color: var(--dim); text-align: right; }
  .echart svg { width: 100%; height: 170px; display: block; margin-top: 6px; }
  .echart text { fill: rgb(255 255 255 / .6); font-size: 10px; font-family: inherit; }
  .edev { margin-top: 12px; } .edev b { font-size: 14px; font-weight: 500; }
  .edev .line { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 14px; }
  .edev .line span:last-child { font-size: 13px; color: rgb(255 255 255 / .8); white-space: nowrap; }
  .edev .track { height: 4px; border-radius: 2px; background: rgb(255 255 255 / .12); margin-top: 5px; overflow: hidden; }
  .edev .track i { display: block; height: 100%; background: rgb(255 255 255 / .8); } .edev .track i.live { background: var(--green); }
  /* edit mode: arrows on each tile to move it */
  .pill.on { background: var(--on); color: var(--on-text); }
  .mv { position: absolute; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: #3a3a3c; display: none;
        place-items: center; color: #fff; }
  .mv svg { width: 18px; height: 18px; }
  /* size buttons (edit mode): lit when the tile is enlarged; width and height, bottom right */
  .mv.w, .mv.h { top: auto; bottom: 10px; }
  .mv.w { right: 50px; } .mv.h { right: 10px; }
  .mv.set { background: #fff; color: #000; }
  .mv.h svg { transform: rotate(90deg); }   /* the same arrow, turned: width and height match */
  body.editing .tile .name, body.editing .tile .sub { padding-right: 92px; }
  .tile.wide { grid-column: span 2; }
  /* a tall tile takes the cell below it too (the same placement as the TV: TilePacker); the others keep their height */
  .grid { grid-auto-rows: minmax(104px, auto); }
  .tile.tall { grid-row: span 2; }
  .mv.l { right: 50px; } .mv.r { right: 10px; } .mv.r svg { transform: rotate(180deg); }
  body.editing .mv { display: grid; }
  body.editing .tile .badge { visibility: hidden; }   /* the arrows take its corner */
  body.editing .tile { box-shadow: inset 0 0 0 1px #48484a; }
  .tile.add { align-items: center; justify-content: center; color: var(--dim); font-weight: 600; border: 1px dashed #48484a; background: none; }
  /* the automation editor */
  .form label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; margin: 16px 2px 8px; }
  .form input[type=text], .form input[type=time], .form select { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line);
        background: var(--tile); color: var(--text); padding: 0 12px; font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { height: 36px; min-width: 44px; padding: 0 10px; border-radius: 18px; background: var(--tile); font-size: 14px; }
  .chips button.on { background: var(--on); color: var(--on-text); }
  .seg { display: inline-flex; background: var(--tile); border-radius: 10px; padding: 2px; }
  .seg button { height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--dim); }
  .seg button.on { background: #3a3a3c; color: #fff; }
  .devrow { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px; }
  .between { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--dim); }
  .form .between input[type=time] { flex: 1; width: auto; }
  .switch-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .sw { width: 51px; height: 31px; border-radius: 16px; background: rgb(255 255 255 / .22); position: relative; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: left .15s; }
  .sw.on { background: var(--green); } .sw.on::after { left: 22px; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .actions button { flex: 1; height: 50px; border-radius: 14px; background: var(--tile2); font-weight: 600; }
  .actions .primary { background: var(--on); color: var(--on-text); }
  .actions .danger { color: var(--red); flex: 0 0 auto; padding: 0 18px; }
  .camview { width: 100%; aspect-ratio: 16 / 9; background: #111; border-radius: 14px; overflow: hidden; display: grid; place-items: center; }
  .camview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .menu button { display: flex; align-items: center; gap: 14px; width: 100%; height: 56px; padding: 0 14px; border-radius: 14px;
                 background: var(--tile); margin-bottom: 8px; font-size: 16px; font-weight: 500; text-align: left; }
  .menu button svg { color: var(--dim); }
  .menu small { color: var(--dim); font-weight: 400; font-size: 13px; margin-left: auto; }
  .note { color: var(--dim); font-size: 13px; line-height: 1.45; margin-top: 10px; }
  .err { color: var(--orange); font-size: 14px; margin-top: 10px; min-height: 18px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgb(40 40 46 / .85); padding: 10px 16px; border-radius: 12px;
           font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  .pair { margin-top: 40px; } .pair p { color: var(--dim); line-height: 1.45; }
</style>
</head>

  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></symbol>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function buzz() { if (navigator.vibrate) navigator.vibrate(8); }
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2200); }

// ---- the secret: from the QR code's link (/r/<secret>) or the 4-digit code, kept on this phone ----
function saved() { try { return localStorage.getItem('tvToken'); } catch (e) { return null; } }
function keep(t) { try { localStorage.setItem('tvToken', t); } catch (e) {} }
const token = location.pathname.startsWith('/r/') ? location.pathname.split('/')[2] : saved();
if (location.pathname.startsWith('/r/') && token) { keep(token); history.replaceState(null, '', '/'); }
const api = '/api/' + token + '/';
// the page's backdrop is the wallpaper the TV is showing now; the last one is remembered, so a reload starts on it
let shownScene;
function backdrop(n) {
  if (typeof n !== 'number' || n === shownScene) return;
  shownScene = n;
  document.documentElement.style.setProperty('--scene', 'url(' + api + 'wallpaper.jpg?id=' + n + '&big=1)');
  try { localStorage.setItem('shScene', n); } catch (e) {}
}
if (token) { try { const n = localStorage.getItem('shScene'); if (n !== null) backdrop(+n); } catch (e) {} }
if (!token) {
  document.documentElement.style.setProperty('--scene', 'url(/scene.jpg)');   // not paired yet: the TV can't be asked
  document.body.innerHTML = `<div class="pair"><h1>Smart Home</h1>
    <p>Enter the 4-digit code shown on the TV in Smart Home → Settings → Phone remote.</p>
    <div class="type"><input id="code" inputmode="numeric" maxlength="4" placeholder="Code" autocomplete="one-time-code"><button id="pair">Pair</button></div>
    <p id="msg"></p></div>`;
  const pair = () => fetch('/api/pair', { method: 'POST', body: $('#code').value.trim() }).then(async r => {
    if (r.ok) { keep(await r.text()); location.reload(); } else $('#msg').textContent = await r.text();
  }).catch(() => { $('#msg').textContent = 'The TV isn\u2019t answering.'; });
  $('#pair').onclick = pair;
  $('#code').addEventListener('keydown', e => { if (e.key === 'Enter') pair(); });
  throw 'not paired';
}
function post(path, body) {
  return fetch(api + path, { method: 'POST', body: body || '', headers: { 'Content-Type': 'text/plain' } })
    .then(r => { if (r.status === 404) { try { localStorage.removeItem('tvToken'); } catch (e) {} location.replace('/'); } return r; })
    .catch(() => { toast('The TV isn\u2019t answering'); return null; });
}

// ---- Home: like the TV app ----
let home = null, filter = 'all';
try { filter = localStorage.getItem('shFilter') || 'all'; } catch (e) {}

function summary(h) {
  const on = h.devices.filter(d => d.online && d.on && d.switch);
  const watts = on.reduce((s, d) => s + (d.watts || 0), 0);
  const parts = [on.length ? `${on.length} plug${on.length > 1 ? 's' : ''} on` : 'Everything off'];
  if (watts > 0) parts.push(Math.round(watts) + ' W now');
  const next = h.automations.find(a => a.enabled && a.next);
  if (next) parts.push(`Next: ${next.name} at ${next.next}`);
  return parts.join(' · ');
}
function tile(cls, icon, badge, name, sub, data, kind, id) {
  const isWide = kind && (home.wide || []).includes(kind + ':' + id);
  const isTall = kind && (home.tall || []).includes(kind + ':' + id);
  if (isWide) cls += ' wide';
  if (isTall) cls += ' tall';
  const arrows = kind && kind !== 'remote' ? `<span class="mv l" data-move="${kind}" data-id="${esc(id)}" data-by="-1"><svg><use href="#i-back"/></svg></span>
    <span class="mv r" data-move="${kind}" data-id="${esc(id)}" data-by="1"><svg><use href="#i-back"/></svg></span>` : '';
  const mv = kind ? `<span class="mv w${isWide ? ' set' : ''}" data-wide="${kind}" data-id="${esc(id)}" data-on="${isWide ? 0 : 1}" title="Width"><svg><use href="#i-resize"/></svg></span>`
    + `<span class="mv h${isTall ? ' set' : ''}" data-tall="${kind}" data-id="${esc(id)}" data-on="${isTall ? 0 : 1}" title="Height"><svg><use href="#i-resize"/></svg></span>` + arrows : '';
  return `<div class="tile ${cls}" role="button" ${data}><span class="top"><svg><use href="#${icon}"/></svg><span class="badge">${esc(badge)}</span></span>
    <span><div class="name">${esc(name)}</div><div class="sub">${esc(sub)}</div></span>${mv}</div>`;
}
function section(title, tiles, show, key) {
  if (!show || !tiles.length) return '';
  const arrows = `<span class="smv"><span data-move="section" data-id="${key}" data-by="-1">▲</span><span data-move="section" data-id="${key}" data-by="1">▼</span></span>`;
  return `<h2>${title}${arrows}</h2><div class="grid">${tiles.join('')}</div>`;
}
function render() {
  const h = home;
  if (!h) return;
  $('#summary').textContent = summary(h);
  const show = f => filter === 'all' || filter === f;
  const scenes = h.scenes.map(s => {
    const off = s.actions - s.onCount;
    const sub = [s.onCount ? s.onCount + ' on' : '', off ? off + ' off' : ''].filter(Boolean).join(', ') || 'Empty';
    return tile('', 'i-star', '', s.name, sub, `data-scene="${esc(s.id)}"`, 'scene', s.id);
  });
  const cams = h.cameras.map(c => tile('', 'i-cam', 'LIVE', c.name, 'Tap to watch', `data-cam="${esc(c.id)}"`, 'camera', c.id));
  const plugs = h.devices.map(d => {
    const state = !d.online ? 'Not answering' : d.watts !== undefined && d.on ? d.watts + ' W' :
      d.tempC !== undefined ? Math.round(d.tempC) + '°' + (d.humidity !== undefined ? ' · ' + Math.round(d.humidity) + '%' : '') : '';
    return tile((d.on ? 'on ' : '') + (d.online ? '' : 'offline'), d.switch ? 'i-plug' : 'i-sensor',
      d.switch && d.online ? (d.on ? 'ON' : 'OFF') : '', d.name, state,
      d.switch ? `data-dev="${esc(d.id)}" data-on="${d.on ? 1 : 0}"` : `data-none="1" data-devid="${esc(d.id)}"`, 'device', d.id);
  });
  const autos = h.automations.map(a => tile('auto ' + (a.enabled ? 'on' : 'off'), 'i-clock', a.enabled ? 'ON' : 'OFF', a.name,
    a.describe + (a.enabled && a.next ? ' · next ' + a.next : ''), `data-auto="${esc(a.id)}"`, 'automation', a.id));
  // in the shared order (Settings → Section order on the TV, or ▲▼ here in edit mode)
  const remotes = [tile('', 'i-tv', '', 'TV', 'Tap for the remote', 'data-remote="tv"', 'remote', 'tv')];
  const parts = { remotes: () => section('Remotes', remotes, show('remotes'), 'remotes'),
    scenes: () => section('Scenes', scenes, show('scenes'), 'scenes'),
    cameras: () => section('Cameras', cams, show('cameras'), 'cameras'),
    plugs: () => section('Plugs & lights', plugs, show('plugs'), 'plugs'),
    automations: () => section('Automations', autos, show('autos'), 'automations') };
  const html = (h.sections || Object.keys(parts)).map(k => parts[k] ? parts[k]() : '').join('');
  $('#sections').innerHTML = html || '<p class="empty">Nothing here yet.</p>';
}
function load() {
  if (document.hidden) return;
  fetch(api + 'home').then(r => r.json()).then(h => { home = h; backdrop(h.scene); render(); }).catch(() => { $('#summary').textContent = 'The TV isn\u2019t answering'; });
}
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  try { localStorage.setItem('shFilter', filter); } catch (err) {}
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x.dataset.f === filter));
let editing = false;
$('#editBtn').onclick = () => {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  $('#editBtn').classList.toggle('on', editing);
  toast(editing ? 'Arrows move tiles and sections; tap a tile to rename or edit it. Tap ✎ again when done.' : 'Done');
};
if (location.hash === '#edit') $('#editBtn').click();   // open straight into edit mode
if (location.hash === '#add') setTimeout(addMenu, 0);
if (location.hash === '#energy') setTimeout(() => $('#openEnergy').click(), 0);   // or straight into + Add
$('#sections').addEventListener('click', e => {
  const tl = e.target.closest('[data-tall]');
  if (tl) {
    buzz();
    post(`tall?kind=${tl.dataset.tall}&id=${encodeURIComponent(tl.dataset.id)}&on=${tl.dataset.on}`).then(() => load());
    return;
  }
  const wd = e.target.closest('[data-wide]');
  if (wd) {
    buzz();
    post(`wide?kind=${wd.dataset.wide}&id=${encodeURIComponent(wd.dataset.id)}&on=${wd.dataset.on}`).then(() => load());
    return;
  }
  const mv = e.target.closest('[data-move]');
  if (mv) {
    buzz();
    post(`move?kind=${mv.dataset.move}&id=${encodeURIComponent(mv.dataset.id)}&by=${mv.dataset.by}`).then(r => {
      if (r && !r.ok) toast(mv.dataset.by === '-1' ? 'Already first' : 'Already last');
      load();
    });
    return;
  }
  const t = e.target.closest('.tile'); if (!t || (t.dataset.none && !editing)) return;
  if (editing) {   // edit mode: arrows move; a scene or automation opens its editor; a plug or camera renames
    if (t.dataset.scene) editScene(home.scenes.find(x => x.id === t.dataset.scene));
    else if (t.dataset.auto) editAuto(home.automations.find(a => a.id === t.dataset.auto));
    else if (t.dataset.cam) rename('camera', t.dataset.cam, t.querySelector('.name').textContent);
    else if (t.dataset.dev || t.dataset.devid) rename('device', t.dataset.dev || t.dataset.devid, t.querySelector('.name').textContent);
    return;
  }
  buzz();
  if (t.dataset.remote) {
    sheet('#remoteSheet', true);
    screenLoop();

  } else if (t.dataset.dev) {
    const on = t.dataset.on !== '1';
    t.classList.toggle('on', on); t.dataset.on = on ? 1 : 0; t.querySelector('.badge').textContent = on ? 'ON' : 'OFF';
    post(`device?id=${encodeURIComponent(t.dataset.dev)}&on=${on ? 1 : 0}`).then(r => { if (r && !r.ok) toast('It didn\u2019t answer'); load(); });
  } else if (t.dataset.scene) {
    t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 400);
    const name = t.querySelector('.name').textContent;
    post(`scene?id=${encodeURIComponent(t.dataset.scene)}`).then(r => r && r.json()).then(j => { if (j) toast(`${name}: ${j.done} done`); load(); });
  } else if (t.dataset.cam) {
    watch(t.dataset.cam, t.querySelector('.name').textContent);
  } else if (t.dataset.auto) {
    editAuto(home.automations.find(a => a.id === t.dataset.auto));
  }
});

// ---- watching a camera: the TV relays it as MJPEG (pictures only), shown in an <img> ----
let watching = null;
function hideClip() {
  const player = $('#motionPlayer');
  player.pause();
  player.removeAttribute('src');
  player.style.display = 'none';
}
// Motion recordings, from the Recordings button at the top. Saved and served by the recorder on the Mac, not the TV.
let clipsShown = 0;   // a newer call wins if the sheet is reopened while loading
async function showClips() {
  const list = $('#motionList'), call = ++clipsShown;
  const still = () => call === clipsShown && $('#motionSheet').classList.contains('open');
  hideClip();
  list.innerHTML = '<p class="empty">Loading…</p>';
  let base;
  try { base = (await fetch(api + 'settings').then(r => r.json())).clips; }
  catch (e) { if (still()) list.innerHTML = '<p class="empty">The TV isn\u2019t answering</p>'; return; }
  if (!still()) return;
  if (!base) { list.innerHTML = '<p class="empty">Add the recorder\u2019s clips link in Settings to see recordings.</p>'; return; }
  let clips;
  // A firewall in stealth mode never answers, so don't wait forever.
  try { clips = await fetch(base + '/clips.json', { signal: AbortSignal.timeout(6000) }).then(r => r.json()); }
  catch (e) { if (still()) list.innerHTML = '<p class="empty">Can\u2019t reach the recorder. Is it running on the Mac, is the Mac awake, and does its firewall allow it?</p>'; return; }
  if (!still()) return;
  if (!clips.length) { list.innerHTML = '<p class="empty">No recordings yet.</p>'; return; }
  list.innerHTML = '<div class="clips">' + clips.map(c => {
    const when = new Date(c.start);
    return `<div><button class="play" data-v="${esc(c.video)}"><img loading="lazy" alt="" src="${esc(base + '/' + c.picture)}">${esc(when.toLocaleDateString([], { month: 'short', day: 'numeric' }))} ${esc(when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))} · ${Math.round(c.seconds)}s</button><button class="save" data-v="${esc(c.video)}" aria-label="Save recording">↓</button><button class="del" data-v="${esc(c.video)}" aria-label="Delete recording">×</button></div>`;
  }).join('') + '</div>';
  const player = $('#motionPlayer');
  list.querySelectorAll('.play').forEach(b => b.onclick = () => {
    player.src = base + '/' + b.dataset.v;
    player.style.display = 'block';
    player.play().catch(() => {});
    player.scrollIntoView({ block: 'nearest' });
  });
  list.querySelectorAll('.save').forEach(b => b.onclick = () => saveClip(base + '/' + b.dataset.v, b.dataset.v));
  list.querySelectorAll('.del').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this recording for good?')) return;
    let ok = false;
    try { ok = (await fetch(base + '/' + b.dataset.v, { method: 'DELETE', signal: AbortSignal.timeout(6000) })).ok; } catch (e) {}
    if (!ok) { toast('Couldn\u2019t delete it'); return; }
    if (player.getAttribute('src') === base + '/' + b.dataset.v) hideClip();
    b.parentElement.remove();
    if (!list.querySelector('.del')) list.innerHTML = '<p class="empty">No recordings yet.</p>';
    toast('Recording deleted');
  });
}
// Saves a clip to the phone. The page is plain http, so the share sheet isn't offered;
// it's a download instead (on an iPhone, into Files > Downloads).
async function saveClip(url, name) {
  toast('Saving…');
  try {
    const blob = await fetch(url, { signal: AbortSignal.timeout(30000) }).then(r => { if (!r.ok) throw 0; return r.blob(); });
    const file = 'door-' + name.replace('/', '-');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: file });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch (e) { toast('Couldn\u2019t save it'); }
}
// One notice when the page opens: the newest motion clip, if it's new since the last visit.
// Tapping it opens the recordings. It doesn't keep checking.
const motion = { cam: null };
function seenMotion(start) { try { localStorage.setItem('seenMotion', start); } catch (e) {} }
function ago(when) {
  const m = Math.round((Date.now() - when) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + (m === 1 ? ' min ago' : ' mins ago');
  const h = Math.round(m / 60);
  if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const d = Math.round(h / 24);
  return d + (d === 1 ? ' day ago' : ' days ago');
}
async function checkMotion() {
  const banner = $('#motionBanner');
  try {
    const base = (await fetch(api + 'settings').then(r => r.json())).clips;
    motion.cam = (await fetch(api + 'home').then(r => r.json())).cameras.find(c => c.clips);
    if (!base || !motion.cam) return;
    const clips = await fetch(base + '/clips.json', { signal: AbortSignal.timeout(6000) }).then(r => r.json());
    let seen = null;
    try { seen = localStorage.getItem('seenMotion'); } catch (e) {}
    const newest = clips[0];
    if (!newest || newest.start === seen) return;
    seenMotion(newest.start);
    if (seen === null && Date.now() - new Date(newest.start) > 86400000) return;   // first visit: skip old news
    banner.innerHTML = `<i></i>New motion at ${esc(motion.cam.name)} ${ago(new Date(newest.start))}`;
    banner.style.display = 'block';
    setTimeout(() => { banner.style.display = 'none'; }, 10000);
  } catch (e) {}
}

function watch(id, name) {
  watching = id;
  $('#camName').textContent = name;
  const cam = home && home.cameras.find(c => c.id === id);   // only cameras the recorder saves from have recordings
  $('#camActions').style.display = cam && cam.clips ? '' : 'none';
  camState('warn', 'Connecting…');
  const img = $('#camImg');
  const connect = () => { img.src = api + 'camera.mjpg?id=' + encodeURIComponent(id) + '&t=' + Date.now(); };
  img.onload = () => { if (watching === id && !camFrozen.n) camState('ok', 'Live'); };
  // The stream ended (the TV gives up after ~45 s without a picture): keep trying while the sheet is open.
  img.onerror = () => { if (watching === id) { camState('warn', 'Reconnecting…'); setTimeout(() => { if (watching === id) connect(); }, 3000); } };
  connect();
  // A stalled MJPEG stream just keeps its last picture, so look at it: a live camera never sends the same
  // picture twice, even of a still hallway. Frozen for ~6 s says reconnecting; changing again says live.
  clearInterval(camFrozen.timer);
  camFrozen.n = 0; camFrozen.last = '';
  camFrozen.timer = setInterval(() => {
    if (watching !== id) return clearInterval(camFrozen.timer);
    let sig = '';
    try {
      const c = camFrozen.canvas || (camFrozen.canvas = Object.assign(document.createElement('canvas'), { width: 24, height: 18 }));
      const g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(img, 0, 0, 24, 18);
      sig = g.getImageData(0, 0, 24, 18).data.join(',');
    } catch (e) { return; }   // no picture yet
    if (sig === camFrozen.last) {
      if (++camFrozen.n === 3) camState('warn', 'Reconnecting…');
    } else {
      if (camFrozen.n >= 3 || $('#camStatus').textContent !== 'Live') camState('ok', 'Live');
      camFrozen.n = 0;
    }
    camFrozen.last = sig;
  }, 2000);
  sheet('#camSheet', true);
}
const camFrozen = { n: 0, last: '', timer: 0, canvas: null };
function camState(dot, text) { $('#camDot').className = 'dot ' + dot; $('#camStatus').textContent = text; }
function unwatch() {   // dropping the image closes the stream, so the TV stops relaying
  watching = null;
  clearInterval(camFrozen.timer);
  $('#camImg').removeAttribute('src');
  sheet('#camSheet', false);
}

const TRIGGERS = [['at', 'At a time of day'], ['sunrise', 'At sunrise'], ['sunset', 'At sunset'], ['tv-on', 'When the TV turns on'], ['tv-off', 'When the TV turns off']];
const OFFSETS = [[-60, '1 h before'], [-30, '30 min before'], [-15, '15 min before'], [0, 'Exactly then'], [15, '15 min after'], [30, '30 min after'], [60, '1 h after']];

const opt = (v, label, sel) => `<option value="${v}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

function editAuto(a) {

    const devs = home.devices.filter(d => d.switch);

      ${x.when === 'at' ? `<label>Time</label><input type="time" id="aTime" value="${hm(Math.max(0, x.minutes))}">` : ''}
      ${sun ? `<label>Offset</label><select id="aOffset">${OFFSETS.map(o => opt(o[0], o[1], o[0] === x.minutes)).join('')}</select>` : ''}
      ${tv ? `<div class="switch-row"><span>Only between certain times</span><span class="sw ${x.window_from >= 0 ? 'on' : ''}" id="aWin" role="switch"></span></div>
        ${x.window_from >= 0 ? `<div class="between"><input type="time" id="aFrom" value="${hm(x.window_from)}"><span>to</span><input type="time" id="aTo" value="${hm(x.window_to)}"></div>` : ''}` : ''}
