plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homecontrol.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.homecontrol.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over adb, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // QR code for the phone remote's link (pure Java, no Google services).
    implementation 'com.google.zxing:core:3.5.3'
    // Announces tv-remote.local on the Wi-Fi for the phone remote.
    implementation 'org.jmdns:jmdns:3.5.9'
    // Camera view: RTSP straight from the camera, no cloud.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    // org.json is part of Android but stubbed in JVM unit tests; the real one for Store/Shelly tests.
    testImplementation 'org.json:json:20231013'
}
